<style>
:root{
--cream: #F4EFE6;
--cream-soft: #F8F4EC;
--cream-card: #FFFFFF;
--highlight: #EFE6D3;
--gold: #7A5B43;
--gold-soft: #8A9670;
--ink: #2C3B2E;
--muted: rgba(44,59,46,0.62);
--border: rgba(122,91,67,0.18);
--error: #B23A3A;
--serif: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
--sans: 'Work Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
--ease: cubic-bezier(0.22, 0.61, 0.36, 1);
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cream);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}

.wrap{max-width:720px;margin:0 auto;padding:96px 32px 140px;position:relative}
@media(max-width:640px){.wrap{padding:56px 22px 96px}}

.progress-track{position:sticky;top:0;left:0;width:100%;height:3px;background:var(--border);z-index:10}
.progress-fill{height:100%;background:var(--gold);transition:width 400ms var(--ease)}

.eyebrow{
font-family:var(--sans);
font-size:12px;letter-spacing:0.22em;text-transform:uppercase;
color:var(--gold);font-weight:600;margin-bottom:28px;
}
.brand-logo{display:block;height:56px;width:auto;margin-bottom:20px}
@media(max-width:640px){.brand-logo{height:46px}}
h1.hero{
font-family:var(--serif);font-weight:600;
font-size:clamp(32px, 5.6vw, 50px);line-height:1.14;letter-spacing:-0.005em;
margin-bottom:24px;
}
h1.hero em{font-style:normal;color:var(--gold);font-weight:600}
p.lead{
font-family:var(--sans);font-weight:400;
font-size:clamp(17px, 2.1vw, 20px);line-height:1.6;
color:var(--ink);opacity:0.82;margin-bottom:52px;max-width:580px;
}

.btn{
display:inline-flex;align-items:center;gap:12px;
background:var(--ink);color:var(--cream);
padding:18px 32px;border-radius:6px;border:none;cursor:pointer;
font-family:var(--sans);font-size:15px;font-weight:600;letter-spacing:0.01em;
transition:background 200ms var(--ease), transform 200ms var(--ease);
}
.btn:hover{background:var(--gold);transform:translateY(-1px)}
.btn:disabled{opacity:0.6;cursor:default;transform:none}
.btn .arrow{transition:transform 200ms var(--ease);display:inline-block}
.btn:hover .arrow{transform:translateX(4px)}

.btn-outline{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn-outline:hover{background:var(--ink);color:var(--cream)}

.screen{animation:fadeIn 420ms var(--ease)}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.screen.leaving{animation:fadeOut 220ms var(--ease) forwards}
@keyframes fadeOut{to{opacity:0;transform:translateY(-8px)}}

.q-index{
font-size:12px;letter-spacing:0.18em;text-transform:uppercase;
color:var(--gold);font-weight:600;margin-bottom:20px;
}
.q-statement{
font-family:var(--serif);font-weight:500;
font-size:clamp(22px, 3.4vw, 30px);line-height:1.35;
margin-bottom:48px;max-width:600px;
}

.scale{display:flex;gap:12px;flex-wrap:wrap}
.scale-btn{
flex:1 1 0;min-width:64px;
background:var(--cream-soft);border:1.5px solid var(--border);border-radius:6px;
padding:22px 10px 16px;text-align:center;cursor:pointer;
transition:border-color 200ms var(--ease), background 200ms var(--ease), transform 150ms var(--ease);
}
.scale-btn:hover{border-color:var(--gold);transform:translateY(-2px)}
.scale-num{
display:block;font-family:var(--serif);font-size:26px;font-weight:600;color:var(--ink);margin-bottom:8px;
}
.scale-label{display:block;font-size:11px;color:var(--muted);letter-spacing:0.04em}
.scale-hint{display:flex;justify-content:space-between;margin-top:14px;font-size:12.5px;color:var(--muted)}

.gate-form{display:flex;flex-direction:column;gap:22px;max-width:440px;margin-top:8px}
.field{display:flex;flex-direction:column;gap:8px}
.field label{
font-size:12px;letter-spacing:0.1em;text-transform:uppercase;
color:var(--gold);font-weight:600;
}
.field input{
font-family:var(--sans);font-size:16px;color:var(--ink);
background:var(--cream-soft);border:1.5px solid var(--border);border-radius:6px;
padding:14px 16px;outline:none;width:100%;
transition:border-color 200ms var(--ease);
}
.field input:focus{border-color:var(--gold)}
.field input.invalid{border-color:var(--error)}
.gate-error{font-size:13.5px;color:var(--error);display:none}
.gate-note{font-size:12.5px;color:var(--muted);margin-top:-6px}

.gate-consent{display:flex;align-items:flex-start;gap:10px}
.gate-consent input{
width:18px;height:18px;flex:0 0 18px;margin-top:2px;
accent-color:var(--gold);cursor:pointer;
}
.gate-consent label{
font-size:13px;line-height:1.55;color:var(--muted);
text-transform:none;letter-spacing:normal;font-weight:400;
cursor:pointer;
}
.gate-consent input.invalid{outline:1.5px solid var(--error);outline-offset:2px;border-radius:3px}

.output{margin-top:8px;display:flex;flex-direction:column;gap:14px}
.output-card{
background:var(--cream-card);border:1px solid var(--border);border-radius:8px;
padding:24px 28px;
opacity:0;transform:translateY(16px);
animation:reveal 500ms var(--ease) forwards;
}
.output-card:nth-child(1){animation-delay:80ms}
.output-card:nth-child(2){animation-delay:200ms}
.output-card:nth-child(3){animation-delay:320ms}
.output-card:nth-child(4){animation-delay:440ms}
.output-card h3{
font-family:var(--serif);font-size:13px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;
color:var(--gold);margin-bottom:10px;
}
.output-card p{font-size:15.5px;color:var(--ink);opacity:0.88;line-height:1.6}
@keyframes reveal{to{opacity:1;transform:translateY(0)}}

.foot{
margin-top:96px;padding-top:48px;border-top:1px solid var(--border);text-align:center;
}
.foot-label{font-size:12px;letter-spacing:0.2em;text-transform:uppercase;color:var(--gold);margin-bottom:16px;font-weight:600}
.foot-body{font-family:var(--serif);font-size:19px;font-weight:500;line-height:1.55;color:var(--ink);opacity:0.86;margin-bottom:28px;max-width:520px;margin-inline:auto}

.restart{display:block;text-align:center;margin-top:28px;font-size:13px;color:var(--muted);cursor:pointer;text-decoration:underline;background:none;border:none;font-family:var(--sans)}
</style>

function save() {
localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

function setProgress(pct) {
progressFill.style.width = pct + '%';

function render() {

renderQuestion(qIndex);
setProgress(Math.round((qIndex / STATEMENTS.length) * 100));
}

const current = app.querySelector('.screen');
if (current) {
current.classList.add('leaving');
setTimeout(() => { state.step = nextStep; render(); }, 200);
} else {
state.step = nextStep;
render();
}

function renderQuestion(index) {
const s = STATEMENTS[index];
app.innerHTML = `
<div class="screen">
<div class="q-index">Pergunta ${index + 1} de ${STATEMENTS.length}</div>
<p class="q-statement">"${s.texto}"</p>
<div class="scale">
${[1,2,3,4,5].map(n => `<div class="scale-btn" data-value="${n}"><span class="scale-num">${n}</span></div>`).join('')}
</div>
<div class="scale-hint"><span>pouco a ver comigo</span><span>é mesmo assim</span></div>
</div>
`;
app.querySelectorAll('.scale-btn').forEach(btn => {
btn.addEventListener('click', () => {
state.scores[s.id] = parseInt(btn.dataset.value, 10);
save();
const next = index + 1;
if (next < STATEMENTS.length) {
transitionTo('q' + next);
} else {
transitionTo('gate');
}
});
});
}

function normalizePhone(raw) {
let v = (raw || '').trim().replace(/[\s\-\(\)]/g, '');
if (v.startsWith('00')) v = '+' + v.slice(2);
if (!v.startsWith('+')) {
const digits = v.replace(/\D/g, '');
if (digits.length === 9) {
v = '+351' + digits;
} else {
v = '+' + digits;
}
}
return v;
}

function submitToSystemIo(nome, email, telefone, arquetipo) {
try {
document.getElementById('stFirstName').value = nome;
document.getElementById('stEmail').value = email;
document.getElementById('stPhone').value = normalizePhone(telefone);
document.getElementById('stArquetipo').value = arquetipo || '';
document.getElementById('stForm').submit();
} catch (e) {
// nunca bloquear a experiência por causa disto
}
}

function renderGate() {
app.innerHTML = `
<div class="screen">
<div class="eyebrow">Quase lá</div>
<h1 class="hero">Para onde envio o teu <em>retrato</em>?</h1>
<p class="lead">Preenche os teus dados para veres o teu arquétipo emocional do dinheiro.</p>
<form class="gate-form" id="gateForm" novalidate>
<div class="field">
<label for="gateNome">Nome</label>
<input type="text" id="gateNome" name="gateNome" autocomplete="name" value="${state.lead.nome || ''}">
</div>
<div class="field">
<label for="gateEmail">Email</label>
<input type="email" id="gateEmail" name="gateEmail" autocomplete="email" value="${state.lead.email || ''}">
</div>
<div class="field">
<label for="gateTelefone">WhatsApp</label>
<input type="tel" id="gateTelefone" name="gateTelefone" autocomplete="tel" placeholder="912 345 678" value="${state.lead.telefone || ''}">
<span class="gate-note">Só os 9 dígitos, ou já com indicativo do país.</span>
</div>
<div class="gate-consent">
<input type="checkbox" id="gateConsent" name="gateConsent" ${state.lead.consent ? 'checked' : ''}>
<label for="gateConsent">Aceito receber emails da Finanças com Alma, incluindo o resultado deste retrato e conteúdos sobre gestão emocional do dinheiro. Podes cancelar a subscrição quando quiseres.</label>
</div>
<div class="gate-error" id="gateError"></div>
<button type="submit" class="btn" id="gateSubmit">Ver o meu retrato <span class="arrow">→</span></button>
</form>
</div>
`;

const form = document.getElementById('gateForm');
const errorBox = document.getElementById('gateError');
const nomeInput = document.getElementById('gateNome');
const emailInput = document.getElementById('gateEmail');
const telefoneInput = document.getElementById('gateTelefone');
const consentInput = document.getElementById('gateConsent');

form.addEventListener('submit', (ev) => {
ev.preventDefault();

const nome = nomeInput.value.trim();
const email = emailInput.value.trim();
const telefone = telefoneInput.value.trim();
const consent = consentInput.checked;

[nomeInput, emailInput, telefoneInput, consentInput].forEach(el => el.classList.remove('invalid'));
errorBox.style.display = 'none';

const emailValido = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
const telefoneDigitos = telefone.replace(/\D/g, '').length;

let mensagens = [];
if (!nome) { nomeInput.classList.add('invalid'); mensagens.push('o teu nome'); }
if (!email || !emailValido) { emailInput.classList.add('invalid'); mensagens.push('um email válido'); }
if (!telefone || telefoneDigitos < 9) { telefoneInput.classList.add('invalid'); mensagens.push('o teu WhatsApp'); }
if (!consent) { consentInput.classList.add('invalid'); mensagens.push('a autorização para receberes email'); }

if (mensagens.length > 0) {
errorBox.textContent = 'Falta preencher ' + mensagens.join(', ') + '.';
errorBox.style.display = 'block';
return;
}

state.lead = { nome, email, telefone, consent };
save();

// o envio para o System.io corre em segundo plano e nunca bloqueia a transição
const { dominant } = computeResult();
const arquetipoNome = ARCHETYPES[dominant] ? ARCHETYPES[dominant].nome : '';
submitToSystemIo(nome, email, telefone, arquetipoNome);

transitionTo('result');
});
}

function computeResult() {
const entries = Object.entries(state.scores);
if (entries.length === 0) return { dominant: 'gastadora', shadow: 'controladora' };
let dominant = entries[0], shadow = entries[0];
entries.forEach(e => {
if (e[1] > dominant[1]) dominant = e;
if (e[1] < shadow[1]) shadow = e;
});
return { dominant: dominant[0], shadow: shadow[0] };
}

function renderResult() {
const { dominant, shadow } = computeResult();
const a = ARCHETYPES[dominant];
